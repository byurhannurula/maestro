# Maestro — standalone. Point it at your own Navidrome instance and download
# backend via .env. If you run those as containers too, drop this service into
# the same compose project / network so the service-name URLs resolve.
#
# Copy .env.example to .env and fill in your values. Every variable in .env is
# passed straight into the container; anything unset falls back to the app's
# own defaults (see src/lib/env.ts). The file is optional — if absent, only
# the container-path overrides below are applied and everything else uses
# env.ts defaults (so a bare `docker compose up` still boots).
services:
  maestro:
    # Build locally, or pull the published image once released.
    # Replace OWNER with your GitHub username/org for GHCR.
    image: ghcr.io/byurhannurula/maestro:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maestro
    # Run as the host user so the app can write to the shared volumes.
    # Reads PUID/PGID from .env (or the shell); falls back to 1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      # Container-internal paths — override anything host-relative in .env so
      # the app writes inside the mounted volumes below.
      - MUSIC_DIR=/music
      - TRASH_DIR=/trash
      - DATABASE_PATH=/data/maestro.db
      # Fixed inside the container; the ports map below is the public face.
      - PORT=4544
    ports:
      - 4544:4544
    volumes:
      # Read-write: the app deletes by moving files out of the library.
      - ./music:/music
      - ./trash:/trash
      - ./maestro-data:/data
    restart: unless-stopped
